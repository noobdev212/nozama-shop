{% partialdef dropdown %}
<div class="dropdown radius-md text-600">
    <div class="flex bg-active-500 padding-md col-gap-1">
        {{ header }}
        {% include 'components/icons.html#arrowdown' %}
    </div>

    <ul class="dropdown-content bg-active-400 pl-md">
        {% for key, item in dict.items %}
            <li key="{{item}}">{{ item }}</li>
        {% endfor %}
    </ul>
</div>
{% endpartialdef %}
